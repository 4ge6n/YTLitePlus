name: Build and Release YTLitePlus (Source-Built YTLite)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "18.6"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube ipa"
        default: "https://hstorage.jp/dl/UR1anTgnOaWj.ipa?download=true"
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: false
        required: false
        type: boolean
      catbox_upload:
        description: "Upload iPA to Catbox.moe (URL)"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTLitePlus
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make python-setuptools jq

      - name: Download Theos
        uses: actions/checkout@v6.0.1
        with:
          repository: theos/theos
          ref: 13c22376b5d83ff759c1993de0a861e673aa522b
          path: theos
          submodules: recursive

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v5.0.2
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/aricloverEXTRA/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mkdir -p $THEOS/sdks
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download Theos Jailed
        uses: actions/checkout@v6.0.1
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Compiling
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Prepare YouTube iPA
        run: |
          wget "$YOUTUBE_URL" --quiet --no-verbose -O YouTube.ipa
          unzip -q YouTube.ipa -d tmp
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' tmp/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          rm -rf tmp/Payload/YouTube.app/_CodeSignature/CodeResources
          rm -rf tmp/Payload/YouTube.app/PlugIns/*
          python - <<EOF
          import plistlib
          def remove_uisupporteddevices(filepath):
              with open(filepath, 'rb') as f:
                  plist = plistlib.load(f)
              if 'UISupportedDevices' in plist:
                  del plist['UISupportedDevices']
              with open(filepath, 'wb') as f:
                  plistlib.dump(plist, f)
          filepath = 'tmp/Payload/YouTube.app/Info.plist'
          remove_uisupporteddevices(filepath)
          EOF
          cp -R Extensions/*.appex tmp/Payload/YouTube.app/PlugIns
        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ env.URL_YT }}

      # --- ここが重要な変更点: YTLite をソースから clone ---
      - name: Install roothide headers
        run: |
          mkdir -p $THEOS/include/roothide
          cat > $THEOS/include/roothide.h << 'HEADER'
          #ifndef ROOTHIDE_H
          #define ROOTHIDE_H
          #import <Foundation/Foundation.h>
          static inline NSString* _Nonnull jbroot(NSString* _Nonnull path) { return path; }
          #define jbroot_c(path) (path)
          #define ROOT_PATH_NS(x) (x)
          #define ROOT_PATH(x) (x)
          #endif
          HEADER
          echo "roothide stub header created at $THEOS/include/roothide.h"
          cat $THEOS/include/roothide.h
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Clone YTLite Source
        run: |
          echo "Removing existing submodule..."
          rm -rf Tweaks/YTLite
          echo "Cloning YTLite source (v5.2.2 public source - no license checks)..."
          git clone --branch v5.2.2 --depth 1 https://github.com/dayanch96/YTLite.git Tweaks/YTLite
          echo "Source cloned."
          rm -f Tweaks/YTLite/YTNativeShare.x
          echo "Remaining .x files:" Tweaks/YTLite/*.x

      - name: Build YTLite from Source
        run: |
          echo "Building YTLite from source..."
          cd Tweaks/YTLite
          THEOS=${{ github.workspace }}/theos make
          echo "Build complete. Output:"
          find . -name "YTLite.dylib" -type f 2>/dev/null
          # Copy to the path expected by the main Makefile's INJECT_DYLIBS
          mkdir -p var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp ${{ github.workspace }}/.theos/obj/arm64/YTLite.dylib var/jb/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || \
          cp .theos/obj/arm64/YTLite.dylib var/jb/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || \
          cp .theos/obj/YTLite.dylib var/jb/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || \
          (echo "ERROR: YTLite.dylib not found!" && find . -name "*.dylib" && exit 1)
          # Copy bundle from source layout
          if [ -d "layout/Library/Application Support/YTLite.bundle" ]; then
            mkdir -p "var/jb/Library/Application Support"
            cp -r "layout/Library/Application Support/YTLite.bundle" "var/jb/Library/Application Support/"
            echo "Bundle copied from layout/"
          else
            echo "WARNING: layout/ not found, using Resources/"
            mkdir -p "var/jb/Library/Application Support/YTLite.bundle"
            cp -r Resources/* "var/jb/Library/Application Support/YTLite.bundle/" 2>/dev/null || true
          fi
          echo "Dylib placed at:"
          ls -la var/jb/Library/MobileSubstrate/DynamicLibraries/
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build Package
        id: build_package
        run: |
          sed -i '' "s/^BUNDLE_ID.*$/BUNDLE_ID = ${{ env.BUNDLE_ID }}/" Makefile
          sed -i '' "s/^DISPLAY_NAME.*$/DISPLAY_NAME = ${{ env.APP_NAME }}/" Makefile
          sed -i '' "s/^PACKAGE_VERSION.*$/PACKAGE_VERSION = ${{ env.YT_VERSION }}-5.2.2-free/" Makefile
          sed -i '' "s/^export TARGET.*$/export TARGET = iphone:clang:${{ inputs.sdk_version }}:14.0/" Makefile
          sed -i '' "s/^export SDK_PATH.*$/export SDK_PATH = \$(THEOS)\/sdks\/iPhoneOS${{ inputs.sdk_version }}.sdk\//" Makefile
          echo "YTLITE_VERSION=5.2.2-free" >> $GITHUB_ENV
          echo "YT_VERSION=${{ env.YT_VERSION }}" >> $GITHUB_ENV
          make package SIDELOAD=1 THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          (mv "packages/$(ls -t packages | head -n1)" "packages/YTLitePlus_${{ env.YT_VERSION }}_5.2.2-free.ipa")
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
          echo -e "==> \033[1mSHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')\033[0m"
          echo -e "==> \033[1mBundle ID: ${{ env.BUNDLE_ID }}\033[0m"
        env:
          THEOS: ${{ github.workspace }}/theos
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4.5.0
        with:
          name: YTLitePlus_${{ env.YT_VERSION }}_5.2.2-free
          path: packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error

      - name: Upload Artifact to Catbox
        if: ${{ inputs.catbox_upload }}
        run: |
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@packages/${{ steps.build_package.outputs.package }}" https://catbox.moe/user/api.php)
          CATBOX_URL=$(echo $RESPONSE | grep -o -E 'https://files.catbox.moe/[^"]*')
          echo "Uploaded to $CATBOX_URL"
          CATBOX_FILE=$(echo $CATBOX_URL | sed 's|https://files.catbox.moe/||')
          echo "CATBOX_FILE=$CATBOX_FILE" >> $GITHUB_ENV
          echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_ENV

      - name: Prepare Release Notes
        if: ${{ inputs.create_release }}
        run: |
          export TODAY=$(date '+%Y-%m-%d')
          cat > release_notes.md << NOTES
          ## YTLitePlus ${{ env.YT_VERSION }}-5.2.2-free

          **YTLite built from public source — no license checks**

          - YouTube: ${{ env.YT_VERSION }}
          - YTLite: 5.2.2 (source-built from dayanch96/YTLite public repo)
          - Built: $TODAY
          - Catbox: ${{ env.CATBOX_FILE }}

          ### What's different from the official release
          YTLite.dylib is compiled directly from the public source code at
          [dayanch96/YTLite](https://github.com/dayanch96/YTLite) tag v5.2.2,
          which does not contain any license/DRM code (dvnCheck, ytpBool,
          ptnRegisterBlock, etc.). All features work without a subscription.
          NOTES

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.YT_VERSION }}-5.2.2-free
          name: v${{ env.YT_VERSION }}-5.2.2-free - YTLitePlus
          files: packages/*.ipa
          draft: true
          body_path: release_notes.md

      - name: Job Summary
        run: |
          echo -e '### Build Complete — License-Free YTLite' >> $GITHUB_STEP_SUMMARY
          echo -e 'YTLite compiled from public source. No Patreon checks.' >> $GITHUB_STEP_SUMMARY
